# Out-of-Order Medium 4-Wide Configuration
[global]
num_cores = 1
enable_mesi = true
dram_latency = 80

[core]
enable_ooo = true
fetch_width = 4
decode_width = 4
issue_width = 4
commit_width = 4
rob_size = 64
rs_size = 32
num_phys_regs = 128

[branch_predictor]
enabled = true
type = TAGE
table_size = 4096

[lsu]
enabled = true
lq_size = 16
sq_size = 16
enable_forwarding = true

[l1i]
enabled = true
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency = 1

[l1d]
enabled = true
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency = 1

[l2]
enabled = true
size_bytes = 524288
line_size = 64
associativity = 8
hit_latency = 10
