# ==============================================================================
# TinyCpuSim Simple In-Order Embedded Core Preset (Cortex-M style)
# Single-issue in-order core with basic Bimodal predictor and un-cached memory
# ==============================================================================

[simulation]
mode = uarch
all_perf = true
enable_topdown = false

[system]
num_cores = 1
dram_latency_cycles = 1
coherence = NONE

[core]
type = SIMPLE_INORDER
fetch_width = 1
decode_width = 1
rename_width = 1
issue_width = 1
commit_width = 1
rob_size = 1
rs_size = 1
num_phys_regs = 32

[branch_predictor]
type = BIMODAL
table_size = 512
btb_size = 512
ras_size = 8

[lsu]
type = PASSTHROUGH

[l1i]
type = PASSTHROUGH

[l1d]
type = PASSTHROUGH

[l2]
type = PASSTHROUGH
