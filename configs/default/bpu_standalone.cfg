# ==============================================================================
# TinyCpuSim BPU Standalone Evaluation Preset
# Evaluates Branch Prediction accuracy in isolation with Zero-Latency memory
# ==============================================================================

[simulation]
mode = uarch
all_perf = true
enable_topdown = true

[system]
num_cores = 1
dram_latency_cycles = 0
coherence = NONE

[core]
type = FAST_FEEDER
fetch_width = 8
decode_width = 8
rename_width = 8
issue_width = 8
commit_width = 8
rob_size = 128
rs_size = 64
num_phys_regs = 256

[branch_predictor]
type = TAGE
table_size = 4096
btb_size = 4096
ras_size = 32
tage_tables = 4

[lsu]
type = PASSTHROUGH

[l1i]
type = ZERO_LATENCY

[l1d]
type = ZERO_LATENCY

[l2]
type = ZERO_LATENCY
