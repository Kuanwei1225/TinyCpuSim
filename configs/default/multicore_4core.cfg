# ==============================================================================
# TinyCpuSim 4-Core SMP Microarchitecture Configuration
# 4 Cores, Coherent L1 Caches with MESI Protocol and Shared 2MB L2
# ==============================================================================

[simulation]
mode = uarch
max_steps = 1000000000
all_perf = true
enable_topdown = true

[system]
num_cores = 4
dram_latency_cycles = 100
coherence = MESI

[core]
type = OOO_DYNAMIC
fetch_width = 4
decode_width = 4
rename_width = 4
issue_width = 4
commit_width = 4
rob_size = 64
rs_size = 32
num_phys_regs = 128

[branch_predictor]
type = TAGE
table_size = 4096
btb_size = 4096
ras_size = 32
tage_tables = 4

[lsu]
type = SPECULATIVE_OOO
lq_size = 16
sq_size = 16
store_forward_latency = 1

[l1i]
type = SET_ASSOCIATIVE
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency_cycles = 1
mshr_entries = 8

[l1d]
type = SET_ASSOCIATIVE
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency_cycles = 1
mshr_entries = 8

[l2]
type = SET_ASSOCIATIVE
size_bytes = 2097152
line_size = 64
associativity = 16
hit_latency_cycles = 12
mshr_entries = 32
