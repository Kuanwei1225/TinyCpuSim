# ==============================================================================
# TinyCpuSim Memory / Cache Evaluation Preset (Fast Feeder)
# Bypasses OoO and BPU overhead to rapidly evaluate Cache and Memory latencies
# ==============================================================================

[simulation]
mode = uarch
all_perf = true
enable_topdown = true

[system]
num_cores = 1
dram_latency_cycles = 80
coherence = MESI

[core]
type = FAST_FEEDER
fetch_width = 8
decode_width = 8
rename_width = 8
issue_width = 8
commit_width = 8
rob_size = 128
rs_size = 64
num_phys_regs = 256

[branch_predictor]
type = IDEAL

[lsu]
type = PASSTHROUGH

[l1i]
type = SET_ASSOCIATIVE
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency_cycles = 1
mshr_entries = 8

[l1d]
type = SET_ASSOCIATIVE
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency_cycles = 1
mshr_entries = 8

[l2]
type = SET_ASSOCIATIVE
size_bytes = 524288
line_size = 64
associativity = 8
hit_latency_cycles = 10
mshr_entries = 16
