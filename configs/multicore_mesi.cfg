# TinyArmSim Configuration: 4-Core MESI Coherent Multi-Core Profile
# Simulates a 4-core CMP with private L1I/L1D, MESI snooping, shared L2, and DDR memory.

[global]
num_cores = 4
enable_mesi = true
dram_latency = 100

[core]
enable_ooo = true
fetch_width = 4
decode_width = 4
issue_width = 4
commit_width = 4
rob_size = 128
rs_size = 32
num_phys_regs = 128

[l1i]
enabled = true
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency = 1

[l1d]
enabled = true
size_bytes = 32768
line_size = 64
associativity = 4
hit_latency = 1

[l2_shared]
enabled = true
size_bytes = 2097152
line_size = 64
associativity = 8
hit_latency = 10

[lsu]
enabled = true
load_queue_size = 32
store_queue_size = 32
dual_issue_agu = true
enable_store_forwarding = true
speculative_loads = true

[branch_predictor]
type = TAGE
btb_entries = 1024
ras_entries = 16
