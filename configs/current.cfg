[simulation]
elf_path = tests/fixtures/test_fibonacci.elf
mode = uarch
all_perf = true
enable_topdown = true
max_steps = 1000000000

[system]
num_cores = 1
dram_latency_cycles = 80
enable_mesi_coherence = true

[core]
enable_ooo = true
fetch_width = 4
decode_width = 4
rename_width = 4
issue_width = 4
commit_width = 4
rob_size = 64
rs_size = 32
num_phys_regs = 128

[branch_predictor]
enabled = true
type = TAGE
table_size = 4096
btb_size = 4096
ras_size = 32
tage_tables = 4

[lsu]
enabled = true
lq_size = 16
sq_size = 16
enable_store_forwarding = true
enable_speculative_load = true
store_forward_latency = 1

[cache_l1i]
enabled = true
size_bytes = 32768
associativity = 4
line_size = 64
hit_latency_cycles = 1
mshr_entries = 8

[cache_l1d]
enabled = true
size_bytes = 32768
associativity = 4
line_size = 64
hit_latency_cycles = 1
mshr_entries = 8

[cache_l2]
enabled = true
size_bytes = 524288
associativity = 8
line_size = 64
hit_latency_cycles = 10
mshr_entries = 16

