# ==============================================================================
# TinyCpuSim Default Baseline Configuration (Single-Core Superscalar OoO)
# ==============================================================================
# This configuration file defines both simulation execution parameters and
# cycle-accurate microarchitectural hardware structures.
#
# Memory size values support human-readable units: 'KB', 'MB', 'B'
# (e.g. 32KB, 64KB, 512KB, 1MB), which are automatically converted to bytes.
# ==============================================================================

[simulation]
# Target bare-metal ARM ELF binary to simulate
elf_path = tests/fixtures/test_fibonacci.elf

# Simulation mode: 'uarch' (Cycle-Accurate Out-of-Order) or 'isa_only' (Pure Emulation)
mode = uarch

# Hardware counter verbosity: 'true' (Detailed 40+ hardware counters) or 'false' (Summary)
all_perf = true

# Top-Down Microarchitecture Analysis (TMAM): 'true' or 'false'
enable_topdown = true

# Maximum instruction execution step limit
max_steps = 1000000000


[system]
# Number of processor cores: 1 for single-core, 2+ for multi-core
num_cores = 1

# Main memory off-chip DRAM access latency in clock cycles
dram_latency_cycles = 80

# Multi-core MESI snooping cache coherence protocol: 'true' or 'false'
enable_mesi_coherence = true


[core]
# Out-of-Order execution engine: 'true' (OoO Tomasulo/ROB) or 'false' (In-Order)
enable_ooo = true

# Number of instructions fetched from L1I / I-Buffer per clock cycle (1, 2, 4, 8)
fetch_width = 4

# Number of instructions decoded into uOps per clock cycle (1, 2, 4, 8)
decode_width = 4

# Number of uOps renamed and allocated into RAT per clock cycle (1, 2, 4, 8)
rename_width = 4

# Number of ready uOps issued from Issue Queue to Execution Units per cycle (1, 2, 4, 8)
issue_width = 8

# Number of completed uOps retired in-order from ROB per clock cycle (1, 2, 4, 8)
commit_width = 4

# Reorder Buffer (ROB) capacity entries (must be > 0, e.g. 16, 32, 64, 128, 256)
rob_size = 64

# Unified Issue Queue / Reservation Station capacity entries (e.g. 16, 32, 64)
rs_size = 32

# Physical Register File (PRF) total registers (must be > 16, e.g. 48, 96, 128, 192)
num_phys_regs = 128


[branch_predictor]
# Branch Prediction Unit (BPU) master enable: 'true' or 'false'
enabled = true

# Direction prediction algorithm: 'IDEAL', 'BIMODAL', 'GSHARE', or 'TAGE'
type = TAGE

# Pattern History Table (PHT) entries (must be a power of 2, e.g. 1024, 2048, 4096)
table_size = 4096

# Branch Target Buffer (BTB) cache entries (must be a power of 2, e.g. 512, 1024, 4096)
btb_size = 4096

# Return Address Stack (RAS) hardware depth entries (e.g. 8, 16, 32)
ras_size = 32

# Number of tagged geometric history tables for TAGE predictor (e.g. 2, 4, 8)
tage_tables = 4


[lsu]
# Master enable for Load/Store Unit
enabled = true

# Load Queue (LQ) maximum entries (must be > 0, e.g. 8, 16, 32)
lq_size = 16

# Store Queue (SQ) maximum entries (must be > 0, e.g. 8, 16, 32)
sq_size = 16

# Enable 0-cycle Store-to-Load Queue bypass forwarding: 'true' or 'false'
enable_store_forwarding = true

# Enable speculative load execution before prior store addresses resolve: 'true' or 'false'
enable_speculative_load = true

# Forwarding bypass latency penalty in clock cycles (typically 1)
store_forward_latency = 1


[cache_l1i]
# L1 Instruction Cache master enable: 'true' or 'false'
enabled = true

# L1I total capacity (supports KB/MB, e.g. 16KB, 32KB, 64KB; stored as bytes)
size_bytes = 32768

# L1I set associativity (must be a power of 2, e.g. 2, 4, 8)
associativity = 4

# L1I cache line block size in bytes (must be a power of 2, e.g. 32, 64)
line_size = 64

# L1I hit latency in clock cycles (typically 1)
hit_latency_cycles = 1

# Number of non-blocking Miss Status Holding Registers (MSHR) (e.g. 4, 8, 16)
mshr_entries = 8


[cache_l1d]
# L1 Data Cache master enable: 'true' or 'false'
enabled = true

# L1D total capacity (supports KB/MB, e.g. 16KB, 32KB, 64KB; stored as bytes)
size_bytes = 32768

# L1D set associativity (must be a power of 2, e.g. 2, 4, 8)
associativity = 4

# L1D cache line block size in bytes (must be a power of 2, e.g. 32, 64)
line_size = 64

# L1D hit latency in clock cycles (typically 1)
hit_latency_cycles = 1

# Number of non-blocking Miss Status Holding Registers (MSHR) (e.g. 4, 8, 16)
mshr_entries = 8


[cache_l2]
# Shared L2 Cache master enable: 'true' or 'false'
enabled = true

# Shared L2 total capacity (supports KB/MB, e.g. 256KB, 512KB, 1MB, 2MB; stored as bytes)
size_bytes = 524288

# Shared L2 set associativity (must be a power of 2, e.g. 4, 8, 16)
associativity = 8

# Shared L2 cache line block size in bytes (must be a power of 2, e.g. 64)
line_size = 64

# Shared L2 hit latency in clock cycles (e.g. 8, 10, 12)
hit_latency_cycles = 10

# Number of non-blocking Miss Status Holding Registers (MSHR) (e.g. 8, 16, 32)
mshr_entries = 16
